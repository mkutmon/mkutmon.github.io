name: Update Publications from ORCID

# Run monthly on the 1st at 9 AM UTC, or manually
on:
  schedule:
    - cron: '0 9 1 * *'  # Monthly on 1st at 9 AM UTC
  workflow_dispatch:     # Allow manual triggering

permissions:
  contents: write  # Required to push commits

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        pip install requests python-dateutil
        
    - name: Run ORCID import script
      run: |
        cd scripts
        python import_orcid.py
        
    - name: Debug - Check what changed
      run: |
        echo "Git status:"
        git status
        echo "Files in _publications:"
        ls -la _publications/
        echo "Porcelain status:"
        git status --porcelain
        
    - name: Check for changes
      id: changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Auto-update publications from ORCID [$(date +'%Y-%m-%d')]"
        git push
